name: CI

# 每次 push / PR 都跑一遍：后端接口自测 + 前端渲染自测。
# 这个库的价值全在数据是否可靠，所以额外加了两条数据断言：
#   - data/*.json 必须是合法 JSON（手改 JSON 打错逗号能立刻发现）
#   - 自测跑完后数据必须与提交时一字不差（验证备份/还原真的有效）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端自测 · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 校验 data/*.json 是不是合法 JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("data").glob("*.json")):
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print("  [FAIL] %s -> %s" % (p, e))
                  bad += 1
                  continue
              n = len(obj) if isinstance(obj, list) else len(obj.get("sources", obj))
              print("  [ok] %-28s %s 项" % (p.name, n))
          sys.exit(1 if bad else 0)
          PY

      - name: 后端接口自测（起临时服务，跑完自动还原 data/）
        run: python selftest.py

      - name: 断言数据未被自测污染
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "::error::自测改动了 data/，备份/还原机制失效："
            git status --porcelain data/
            git diff --stat data/
            exit 1
          fi
          echo "data/ 与提交时一致，备份/还原正常。"

      - name: 测试 deploy_oss.py（参数解析与分支，不联网）
        # 守的线：① 地域必填且**不兜底**（兜底 cn-hangzhou 与香港 Bucket 冲突，
        # 表现是 403「must be addressed using the specified endpoint」，看不出原因）；
        # ② 带未核实队列的产物不许上传（曾把 441 条素材推上公网）；
        # ③ 参数闸门要在真的碰阿里云之前生效。
        run: python -m unittest scripts.test_deploy_oss
      - name: 测试 publish_ready.py（内容包闸门）
        run: python -m unittest scripts.test_publish_ready
      - name: 测试 fit_ready.py（三套人工判断的补齐与方向一致）
        run: python -m unittest scripts.test_fit_ready
      - name: 测试 release.py（六步顺序 + 失败即停 + 退出码语义）
        # 顺序错了不会报错，只会静默产出错的东西（fit 跑在 publish 前 /
        # build 跑在 score 前）。这里守三条线：
        # ① 步骤表声明的依赖与实际顺序一致（不是逐对手写断言，是声明式校验）；
        # ② 任何一步非 0 退出都不继续往下跑；
        # ③ 对外产物目录默认 public，不接受 dist（那是带 inbox 的预览版）。
        run: python scripts/release.py --selfcheck && python -m unittest scripts.test_release

      - name: 测试 auto_deploy.py（兜底部署的判断准确性）
        # 判断判错的两种方式都不报错：把没变的说成变了 → 每天空转部署；
        # 把变了的说成没变 → 改了永远不上线且无提示。
        # 所以既测归一化（时间戳不算差异），也用**真实构建的两份产物**验证。
        run: python -m unittest scripts.test_auto_deploy

      - name: 测试 make_article.py（草稿生成与发布红线）
        # 守两条线：① 人工表（EDITORIAL_WEIGHT/TITLE_OVERRIDES）里的 id 不能写错，
        # 错一个会静默失效、排名悄悄跑偏；② 正文里绝不能出现裸 URL。
        run: python scripts/test_make_article.py

      - name: 测试 verify_rules.py（规则引擎 + 等级与证据）
        # 这是整站的判定真源：能不能发布、标什么等级、进哪个池，都由它算。
        # 守的线：① 门槛「一道成立就进库」不被改回一票否决；
        # ② 必填缺项永远不可发布；③ **声称的核实等级必须有来源撑住**
        # （曾经 11 条案例标着 stripe 却只有一个第三方拆解站来源）；
        # ④ human_read / caliber_consistent 保持不拦发布。
        run: python scripts/test_verify_rules.py

      - name: 测试 ai_verify.py（卡点挑选与草稿映射，离线）
        # AI 自动核实的纯函数部分：候选挑选、AI 回答 → 草稿的映射。
        # 守的线：没有一手来源不勾 primary_source、human_read 不许自动勾、
        # bonus 必须与来源构成对得上 —— AI 的布尔回答不许裸信。
        run: python scripts/test_ai_verify.py

      - name: 测试 triage.py（零成本初筛：打分 / 判级 / 去重 / 排序契约）
        # 初筛决定「哪条值得花 AI 核」，判错就是把钱花在错的地方 ——
        # 而且它判错时**不会报错**，只会安静地把一批噪音排到前面。
        # 守的线：① 疑似金额（从标题正则抽的数）不算数字；
        # ② 没有数字的不许进深核；③ 候选池不由分数判死（人工挑的不能被机器归档）；
        # ④ 材料已齐的跳过；⑤ 人工标的「高优先级」压过机器分。
        run: python scripts/test_triage.py

      - name: 测试 harvest.py 五源解析（离线，用真抓下来的 fixture）
        # 采集是无人值守的：解析器一旦因对方改版而静默失灵，表现是
        # 「今天没采到东西」而不是报错，属于最难发现的一类故障。
        # 守的线：① 每条采集结果都必须带 source_kind（可信度不能丢）；
        # ② IndieHackers 的自报数字必须标 self_reported；
        # ③ Product Hunt 不许带任何收入字段；④ sitemap 里的里程碑 URL 要丢掉。
        run: python scripts/test_harvest_sources.py

      - name: 测试 prerender.py（常量对齐、脱离 JS、转义）
        # 守三条线：① prerender.py 里的文案常量与 app.js 不能漂移（漂了不报错，
        # 只是同一条案例在两个地方显示成两个词）；② 案例页不跑 JS 也得读得到正文；
        # ③ 来源文本里的 < > & 必须转义干净。
        run: python scripts/test_prerender.py

  frontend:
    name: 前端自测 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: app.js 语法检查
        run: node --check static/app.js

      # 后台是独立站点，脚本也要单独过一遍语法 ——
      # 它不被 static/index.html 引用，公开站那步检查覆盖不到它。
      - name: 后台脚本语法检查
        run: |
          node --check admin/app.js
          node --check admin/verify.js

      - name: 测试脚本语法检查
        run: |
          node --check uitest.js
          node --check uitest-admin.js

      - name: 渲染冒烟测试（DOM 桩，无需浏览器）
        run: node uitest.js

      - name: 后台冒烟测试（登录 / 核实 / 入库）
        # 这步需要能起 python 子进程（读 verify_rules.py 的规则表）——
        # 后台的「门槛/必填/加分」三个数字必须来自真实现，不能写死。
        # 找不到解释器时会明确报出来（以前是吞掉异常只说「读不到」）。
        run: node uitest-admin.js

      - name: 断言测试没有写脏 data/
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "::error::前端测试改动了 data/"
            git status --porcelain data/
            exit 1
          fi
          echo "data/ 未被改动。"

  static:
    name: 静态产物 · 构建 + 只读模式测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建静态站
        # 这个 job 守的是「能部署出去的那份东西确实可用」。
        # 本地产物和 CI 产物理应一致，所以这里也真跑一遍构建。
        run: python scripts/build_static.py

      - name: 测静态产物（应切到只读模式、从 data.js 取数）
        run: node uitest.js --static

      - name: 校验预渲染产物（案例页不跑 JS 也要读得到正文）
        # build_static.py 构建时已经自检过一遍，这里是独立复检：
        # 万一以后有人绕过 build_static.py 直接调 prerender，也不会漏掉。
        run: python scripts/prerender.py --check --out dist

      - name: 断言构建只产出 dist/，没碰别的地方
        run: |
          # dist/ 已在 .gitignore 里，所以构建完仓库应当完全干净
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建过程改动了被跟踪的文件："
            git status --porcelain
            exit 1
          fi
          echo "仓库干净，构建只产出 dist/。"

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          retention-days: 7
