name: 每日采集

# 在 GitHub 上直接更新数据，不需要开本地电脑。
# 流程：取回最新队列 → 采集 → 校验 → 提交到 data 分支 → 推送 data 分支。
#
# **重要约定（2026-09-24 起）**：采集队列（data/inbox.json 等）现在**只提交到
# 独立的 `data` 分支**，不再碰 `main`。原因：此前采集直接提交到 main，导致本地
# 每次 push 都要 rebase。把机器数据从 main 剥离后，main 只承载人工的代码/案例
# 改动，本地 push 永远是快进。
#   本地要构建含 inbox 的 dist 时，从 data 分支取回：bash scripts/sync_inbox.sh
#
# **采集提交的父必须是 origin/data（2026-10-19 用 25 天全红换来的）**：
# 提交只能用 git 管件造（`write-tree` + `commit-tree -p origin/data`），
# 绝不能先 `git commit` 到本地 main 再 `git push HEAD:data`。后者隐含
# 「data 分支永远是 main 的祖先」，而 main 天天在本地前进——9-25 起这个
# 假设就破了，之后每天必被 non-fast-forward 拒，白挂 25 天。
#
# 为什么放 GitHub 跑而不是本地：
#   - 不依赖你本机开着、网络通、代理不捣乱
#   - Runner 在境外，访问 Hacker News / TrustMRR 更顺
#   - 结果直接落在远程仓库，本地随时 git pull
#
# **这个 workflow 不部署。** 它以前会构建 + 部署到 OSS，但那是错的：
#   1. 采集只写 data/inbox.json（采集队列），而对外产物是
#      `build_static.py --no-inbox --out public` —— **产物里根本不含 inbox**。
#      也就是说部署 public 等于把同样的站点重传一遍，白跑。
#      （曾经它连 `--no-inbox` 都没加，用默认的 dist，于是每天把 400+ 条
#      未核实素材的**全文**推上公网，跑了至少 4 天。）
#   2. 案例内容（data/cases.json）只会由人工核实后改动，而那条路走的是
#      `scripts/release.py`，它自己就包含 build + deploy。
# 所以「什么时候上线」只有一个入口：本地发布。CI 的职责到推送为止。
# 构建能力仍受 CI 保护 —— ci.yml 的 static job 每次都会真跑一遍构建。
#
# 两个容易踩的点，这里都处理了：
#   1) GITHUB_TOKEN 推的提交**不会**再触发 ci.yml（GitHub 防递归的设计），
#      所以数据校验必须内联在这个 workflow 里，不能指望 ci.yml 兜底。
#   2) schedule 触发时 inputs 上下文是空的，所以输入一律走 github.event.inputs
#      并在 shell 里做默认值，不依赖表达式对 undefined 的处理。

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00。
    # GitHub 的定时任务不精确：高峰期可能延迟几十分钟，极端情况跳过某天。
    # 采集场景无所谓，漏一天下次补上就是。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 采集源
        required: false
        default: all
        type: choice
        options: [all, hn, trustmrr, ph]
      limit:
        description: 单源条数上限
        required: false
        default: '40'
      dry_run:
        description: 只演练不写入（调试采集规则用）
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # 需要推送提交

# 同一时间只跑一个采集，避免两次采集同时 push 互相打架
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: 采集 → 校验 → 提交
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 配置提交身份
        # 用 bot 身份，不冒充作者，这样一眼能看出哪些提交是机器干的
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 取回最新采集队列（从 data 分支）
        # 采集队列（inbox 等）只在独立的 data 分支累积，main 不追踪它。
        # 每次采集前先把 data 分支的最新队列写回工作区，才能在旧队列上追加、
        # 而不是从空开始（否则每天互相覆盖、无法累积）。
        # 用 `git show > file` 而非 `git checkout`：只写工作区、不碰索引，
        # 避免 inbox 被暂存后让后面「校验」步骤的 git status 误报 data/ 脏。
        # 首次运行 data 分支还不存在，忽略错误从空开始即可。
        run: |
          git fetch origin data || true
          for f in data/inbox.json data/inbox_archive.json data/last_harvest.json; do
            if git cat-file -e "origin/data:$f" 2>/dev/null; then
              git show "origin/data:$f" > "$f"
            else
              echo "data 分支尚无 $f，本次从空开始。"
            fi
          done

      - name: 采集（只写 data/，不碰 git）
        # 直接调 harvest.py，**不再过 daily_harvest.py**。
        # daily_harvest.py 自带「检测变化 → git add → commit」三段 git 逻辑，
        # 那是 9-24「采集队列改由 data 分支承载」之前的 main 时代残留，在 CI 里
        # 只有一个效果是负的：
        #   ① 采集队列三个文件都被 .gitignore 挡着，它的 git status 永远看不到
        #      「变化」，于是每次跑完都打印「data/ 无变化 —— 本次没捞到新素材」，
        #      而实际上可能刚捞了 165 条 —— 日志与事实相反，看日志的人会被骗；
        #   ② 它**看得到**的反倒是 harvest 顺手重写的 data/trustmrr_profiles.json
        #      （派生缓存，曾是 main 追踪文件，已由 .gitignore 挡下）——
        #      2026-10-19 实跑日志里的 a3052bf 就是它把那坨机器数据 commit 到了
        #      本地 main：既违反「main 只承载人工改动」，又把「校验」步骤的
        #      data/ 干净断言洗成假绿（脏被它先提交了，git status 自然看不到）；
        #   ③ 它提交到本地 main 的东西，下一步会连同队列一起被推到 data 分支。
        # CI 只借用它的采集步 —— 参数与 daily_harvest.py 内部调 harvest.py 的
        # 用法完全一致（同一脚本、同一参数），行为不会漂。
        env:
          SRC: ${{ github.event.inputs.source }}
          LIM: ${{ github.event.inputs.limit }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          SRC="${SRC:-all}"
          LIM="${LIM:-40}"
          echo "采集源=$SRC  单源上限=$LIM  只演练不写入=$DRY"
          if [ "$DRY" = "true" ]; then
            python scripts/harvest.py --source "$SRC" --limit "$LIM" --dry-run
          else
            python scripts/harvest.py --source "$SRC" --limit "$LIM"
          fi

      - name: 校验数据没被写坏
        # 这是本次自动化的安全阀：机器采回来的东西必须先过校验才允许推上去。
        # 数据坏了 job 直接失败，远程保持原样。
        run: |
          echo "== 1) data/*.json 必须是合法 JSON =="
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("data").glob("*.json")):
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print("  [FAIL] %s -> %s" % (p, e))
                  bad += 1
                  continue
              n = len(obj) if isinstance(obj, list) else len(obj.get("sources", obj))
              print("  [ok] %-28s %s 项" % (p.name, n))
          sys.exit(1 if bad else 0)
          PY

          echo
          echo "== 2) 接口自测（备份 → 测试 → 还原 data/）=="
          python selftest.py

          echo
          echo "== 3) 自测不许留下额外改动（验证备份/还原真的有效）=="
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "::error::自测跑完后 data/ 是脏的，说明备份/还原失效："
            git status --porcelain -- data/
            git diff --stat -- data/
            exit 1
          fi
          echo "data/ 干净，备份/还原正常。"

      - name: 提交采集数据到 data 分支
        # 采集队列只推到独立的 data 分支，绝不碰 main（main 是人工的代码/案例，
        # 只有它干净，你本地 push 才永远是快进、不需要 rebase）。
        #
        # ⚠⚠ 2026-10-19 修「连挂 25 天」：提交必须挂在 origin/data 之上。
        # 旧写法是先 `git commit`（建在本地 main 上）再 `git push HEAD:data`，
        # 从 9-25 起每天必挂，原因只有一个：data 分支自 9-24 起就含有 main
        # 没有的采集提交（8c161bc），而 main 之后天天在本地前进 ⇒ 建在 main
        # 上的采集提交永远不是 data tip 的后代，push 必然 non-fast-forward
        # 被拒。9-24 那次能成，只因当天 main 恰好就是 data 的父——「data
        # 永远是 main 的祖先」这个隐含假设，从第一次本地提交起就注定维持不住。
        #
        # 现在改用 git 管件直接造提交：`write-tree` 把暂存区（= 当前 main 的
        # 内容 + 三个队列文件）落成一棵树，`commit-tree` 以 **origin/data**
        # 为父提交。本地 main 的指针从头到尾不动、工作区不动，只有 data 分支
        # 前进——所以旧写法结尾的 `git reset origin/main`（防采集提交泄漏到
        # main）也不再需要：根本没有提交落在 main 上。
        #
        # 「有没有真变化」跟 origin/data 比，不跟 HEAD 比：这三个文件在 main
        # 上不存在（.gitignore 挡着），跟 HEAD 比永远算「新文件」，没有新增
        # 的日子也会制造空提交。
        # 若采集期间 data 分支被外人推过，push 会以 non-fast-forward 失败
        # （父还是旧 tip）—— fail loud，不会静默覆盖别人的提交。
        run: |
          if git rev-parse --verify -q origin/data >/dev/null; then
            HAVE_DATA=1
          else
            HAVE_DATA=0
            echo "origin/data 还不存在，本次将创建 data 分支。"
          fi

          # 0) data 分支上有的队列文件，工作区必须也有（fetch 步负责写回来）。
          #    缺了就是异常：宁可失败，也不能把「删除」提交上去、把队列抹掉。
          if [ "$HAVE_DATA" = 1 ]; then
            for f in data/inbox.json data/inbox_archive.json data/last_harvest.json; do
              if git cat-file -e "origin/data:$f" 2>/dev/null && [ ! -f "$f" ]; then
                echo "::error::$f 在 data 分支存在但工作区没有，放弃本次提交。"
                exit 1
              fi
            done
          fi

          # 1) 先把队列文件强制入暂存区（main 上它们是忽略的，必须 -f）。
          #    ⚠ 必须先 add 再比，不能反过来：git diff <commit> -- <路径>
          #    看不见**未追踪**的工作区文件——内容一模一样也会被报成
          #    「deleted file」。2026-10-19 dry-run 实测踩到：文件刚被
          #    `git show` 写回来、与 data 分支逐字节相同，diff 仍报删除，
          #    于是「无新增」的日子也造了提交。进了暂存区才参与比较，
          #    所以下面用 --cached 比「暂存区 vs origin/data」。
          for f in data/inbox.json data/inbox_archive.json data/last_harvest.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          # 2) 暂存区与 data 分支没差异 = 本次无新增（跟 data 分支比，不跟
          #    HEAD 比：这三个文件在 main 上不存在，跟 HEAD 比永远算新文件）
          if [ "$HAVE_DATA" = 1 ] \
             && git diff --quiet --cached origin/data -- data/inbox.json data/inbox_archive.json data/last_harvest.json; then
            echo "队列与 data 分支一致，没有待提交的采集数据（本次无新增）。"
            git reset -q HEAD -- data/inbox.json data/inbox_archive.json data/last_harvest.json
            exit 0
          fi
          if [ -z "$(git diff --cached --name-only)" ]; then
            if [ "$HAVE_DATA" = 1 ]; then
              echo "::error::判过有变化，却没有任何队列文件进得了暂存区，不敢造提交。"
              exit 1
            fi
            echo "没有队列文件可提交（首次运行且本次无采集结果）。"
            exit 0
          fi

          # 3) 造树 → 以 origin/data 为父造提交 → 推送
          N=$(python -c "import json;d=json.load(open('data/last_harvest.json',encoding='utf-8'));print(d.get('added',0))" 2>/dev/null || echo '?')
          DATE=$(date +%F)
          TREE=$(git write-tree)
          if [ "$HAVE_DATA" = 1 ]; then
            NEW=$(git commit-tree "$TREE" -p origin/data -m "采集：新增 $N 条素材（$DATE）")
          else
            NEW=$(git commit-tree "$TREE" -m "采集：新增 $N 条素材（$DATE）")
          fi
          echo "新提交 $NEW（父：$( [ "$HAVE_DATA" = 1 ] && git rev-parse --short origin/data || echo '无（首建）')）"
          git push origin "$NEW:refs/heads/data"
          echo "已推送到 data 分支（main 不受影响，本地 main 从未移动）。"

      - name: 写运行摘要
        if: always()
        run: |
          {
            echo "### 每日采集"
            echo ""
            python -c "import json,os;p='data/last_harvest.json';d=json.load(open(p,encoding='utf-8')) if os.path.exists(p) else {};print('- 新增：**%s** 条' % d.get('added','?'));print('- 来源分布：%s' % (d.get('by_source') or {}));print('- 采集队列：**%s** 条' % d.get('inbox_total','?'));print();print('值得先看的几条：');[print('- %s（%s，热度 %s）%s' % (t.get('name'),t.get('source'),t.get('heat'),t.get('url') or '')) for t in (d.get('top') or [])[:5]]"
            echo ""
            echo "本次只更新采集队列，**没有部署**。"
            echo "采集队列是给人挑素材用的，对外产物不含它（build_static --no-inbox）。"
            echo "要上线新案例：本地跑 \`python scripts/release.py --bucket ai-case-library --region cn-hongkong\`"
          } >> "$GITHUB_STEP_SUMMARY"
